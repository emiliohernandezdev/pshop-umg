# fly.toml app configuration file generated for pshop-umg on 2026-10-24T17:54:15Z

app = 'pshop-umg'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'prestashop_data'
  destination = '/var/www/html'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
